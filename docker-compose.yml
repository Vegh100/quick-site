version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: quick-site-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickuser
      POSTGRES_PASSWORD: quickpass
      POSTGRES_DB: quickdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickuser -d quickdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
